<!-- FORMULARIO RAPIDO -->
<section class="qf" id="formulario">
<div class="wrap qf__in">
<div class="form-card">
<span class="label label--blue" data-i18n="k024">Portabilidade</span>
<h2 data-i18n="k025">Solicite sua portabilidade</h2>
<p data-i18n="k026">Você mantém o número atual. Um especialista conduz o processo.</p>
<form class="form" data-produto="Portabilidade AzuPhone" data-wa="551151520050">
<div class="form-section">
<h3 data-i18n="k_titularLabel">Titular da linha</h3>
<div class="frow">
<label data-i18n="k029" for="port-nome">Nome / Razão Social <span class="req">*</span></label>
<input id="port-nome" name="Nome" required type="text"/>
</div>
<div class="frow frow--cols-2">
<div>
<label data-i18n="k_cpfLabel" for="port-cpf">CPF / CNPJ <span class="req">*</span></label>
<input id="port-cpf" name="CPF" required type="text"/>
</div>
<div>
<label data-i18n="k_docLabel" for="port-doc">Documento <span class="req">*</span></label>
<input id="port-doc" name="Documento" required type="text"/>
</div>
</div>
<div class="frow">
<label data-i18n="k_inscLabel" for="port-insc">Inscrição municipal <span class="req">*</span></label>
<input id="port-insc" name="Inscricao" required type="text"/>
</div>
</div>

<div class="form-section">
<h3 data-i18n="k_enderecoLabel">Endereço</h3>
<div class="frow">
<label data-i18n="k_ruaLabel" for="port-rua">Endereço <span class="req">*</span></label>
<input id="port-rua" name="Endereco" required type="text"/>
</div>
<div class="frow frow--cols-2">
<div>
<label data-i18n="k_numLabel" for="port-num">Número <span class="req">*</span></label>
<input id="port-num" name="Numero" required type="text"/>
</div>
<div>
<label data-i18n="k_compLabel" for="port-comp">Complemento</label>
<input id="port-comp" name="Complemento" type="text"/>
</div>
</div>
<div class="frow frow--cols-2">
<div>
<label data-i18n="k_bairroLabel" for="port-bairro">Bairro <span class="req">*</span></label>
<input id="port-bairro" name="Bairro" required type="text"/>
</div>
<div>
<label data-i18n="k_cepLabel" for="port-cep">CEP <span class="req">*</span></label>
<input id="port-cep" name="CEP" required type="text"/>
</div>
</div>
<div class="frow frow--cols-2">
<div>
<label data-i18n="k_cidadeLabel" for="port-cidade">Cidade <span class="req">*</span></label>
<input id="port-cidade" name="Cidade" required type="text"/>
</div>
<div>
<label data-i18n="k_estadoLabel" for="port-estado">Estado <span class="req">*</span></label>
<select id="port-estado" name="Estado" required>
<option value="">Selecione...</option>
<option>SP</option>
<option>RJ</option>
<option>MG</option>
<option>BA</option>
<option>SC</option>
</select>
</div>
</div>
</div>

<div class="form-section">
<h3 data-i18n="k_contatoLabel">Contato</h3>
<div class="frow frow--cols-2">
<div>
<label data-i18n="k_telLabel" for="port-tel">Telefone <span class="req">*</span></label>
<input id="port-tel" name="Telefone" required type="tel"/>
</div>
<div>
<label data-i18n="k_emailLabel" for="port-email">E-mail <span class="req">*</span></label>
<input id="port-email" name="Email" required type="email"/>
</div>
</div>
</div>

<div class="form-section">
<h3 data-i18n="k_linhaLabel">Linha a portar</h3>
<div class="frow">
<label data-i18n="k_numPortLabel" for="port-numport">Número a portar <span class="req">*</span></label>
<input id="port-numport" name="NumeroPorta" required type="tel"/>
</div>
<div class="frow frow--cols-2">
<div>
<label data-i18n="k_popLabel" for="port-pop">POP (Cidade do número) <span class="req">*</span></label>
<input id="port-pop" name="POP" required type="text"/>
</div>
<div>
<label data-i18n="k_operadoraLabel" for="port-op">Operadora atual <span class="req">*</span></label>
<input id="port-op" name="Operadora" required type="text"/>
</div>
</div>
</div>

<div class="form-actions">
<button class="btn" type="submit" data-i18n="k033">Solicitar portabilidade</button>
</div>
<p class="form-help" data-i18n="k034">Respondemos em até 24h. Horário comercial: seg-sex, 8h-18h.</p>
</form>
</div>
</div>
</section>
